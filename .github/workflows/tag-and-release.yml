name: Publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à compiler'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du fork
        uses: actions/checkout@v4

      - name: 📦 Télécharge le bundle depuis la release du fork
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/ilyes-itune/wcpos-custom/releases/download/bundle-v1.8.9/wcpos-dist.zip" `
            -OutFile "wcpos-dist.zip" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "wcpos-dist.zip" -DestinationPath dist -Force
          Write-Host "Contenu du dist :"
          Get-ChildItem dist | Select-Object Name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
  - name: 🔧 Patch bundle WCPOS
        shell: python
        run: |
          path = 'dist/entry-ff3d85c05501dc9df6d40e5df26d68c5.js'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          patches = [
              # Label sidebar : Customers → Caisse 
              ('"common.customers":"Customers"',
               '"common.customers":"Caisse"'),

              # Icône sidebar clients : users → euro
              ('M144 0a80 80 0 1 1 0 160 80 80 0 1 1 0-160m368 0a80 80 0 1 1 0 160 80 80 0 1 1 0-160M0 298.7C0 239.8 47.8 192 106.7 192h42.7c15.9 0 31 3.5 44.6 9.7-1.3 7.2-1.9 14.7-1.9 22.3 0 38.2 16.8 72.5 43.3 96H21.3C9.6 320 0 310.4 0 298.7M405.3 320h-.7c26.6-23.5 43.3-57.8 43.3-96 0-7.6-.7-15-1.9-22.3 13.6-6.3 28.7-9.7 44.6-9.7h42.7c58.9 0 106.7 47.8 106.7 106.7 0 11.8-9.6 21.3-21.3 21.3zM224 224a96 96 0 1 1 192 0 96 96 0 1 1-192 0m-96 261.3c0-73.6 59.7-133.3 133.3-133.3h117.4c73.6 0 133.3 59.7 133.3 133.3 0 14.7-11.9 26.7-26.7 26.7H154.7c-14.7 0-26.7-11.9-26.7-26.7',
              'M48.1 240c-.1 2.7-.1 5.3-.1 8v16c0 2.7 0 5.3 .1 8H32c-17.7 0-32 14.3-32 32s14.3 32 32 32H60.3C89.9 419.9 170 480 264 480h24c17.7 0 32-14.3 32-32s-14.3-32-32-32H264c-57.9 0-108.2-32.4-133.9-80H256c17.7 0 32-14.3 32-32s-14.3-32-32-32H112.2c-.1-2.6-.2-5.3-.2-8V248c0-2.7 .1-5.4 .2-8H256c17.7 0 32-14.3 32-32s-14.3-32-32-32H130.1c25.7-47.6 76-80 133.9-80h24c17.7 0 32-14.3 32-32s-14.3-32-32-32H264C170 32 89.9 92.1 60.3 176H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h16.1z'),

              # ViewBox SvgUsers : 640x512 → 320x512
              ('Object.assign({viewBox:"0 0 640 512"},c,{children:l})',
               'Object.assign({viewBox:"0 0 320 512"},c,{children:l})'),
          ]

          results = []
          for old, new in patches:
              count = content.count(old)
              content = content.replace(old, new)
              results.append(f'  {count}x "{old[:40]}..."')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          print('Patches appliques:')
          for r in results: print(r)
          
      - name: 🏗 Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dépendances (sans postinstall)
        run: npm install --ignore-scripts
        shell: pwsh

      - name: 🔨 Rebuild better-sqlite3
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "Electron version: $electronVersion"
          npx @electron/rebuild -v $electronVersion -f -o better-sqlite3
        shell: pwsh

      - name: 🚀 Build Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-forge make --platform=win32 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== DERNIÈRES 300 LIGNES DU LOG ==="
            Get-Content build-log.txt | Select-Object -Last 300
            exit 1
          }
        shell: pwsh

      - name: 📋 Upload build log en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: 📦 Upload l'exécutable Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcpos-windows
          path: out/make/**/*
          if-no-files-found: warn
