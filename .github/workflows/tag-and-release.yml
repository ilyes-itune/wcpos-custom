name: Publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à compiler'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du fork
        uses: actions/checkout@v4

      - name: 📦 Télécharge le bundle depuis la release du fork
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/ilyes-itune/wcpos-custom/releases/download/bundle-v1.8.9/wcpos-dist.zip" `
            -OutFile "wcpos-dist.zip" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "wcpos-dist.zip" -DestinationPath dist -Force
          Write-Host "Contenu du dist :"
          Get-ChildItem dist | Select-Object Name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: 🏗 Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dépendances (sans postinstall)
        run: npm install --ignore-scripts
        shell: pwsh

      - name: 🔨 Rebuild better-sqlite3
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "Electron version: $electronVersion"
          npx @electron/rebuild -v $electronVersion -f -o better-sqlite3
        shell: pwsh

      - name: 🚀 Build Windows (sans lint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compile directement via webpack + forge, en sautant le lint
          npx electron-forge make --platform=win32 --skip-package=false
        shell: pwsh
        continue-on-error: false

      - name: 📦 Upload l'exécutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: wcpos-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
          if-no-files-found: warn
