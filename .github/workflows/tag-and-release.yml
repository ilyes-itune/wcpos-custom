name: Publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à compiler'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du fork
        uses: actions/checkout@v4

      - name: 📦 Télécharge le bundle depuis la release du fork
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/ilyes-itune/wcpos-custom/releases/download/bundle-v1.8.9/wcpos-dist.zip" `
            -OutFile "wcpos-dist.zip" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "wcpos-dist.zip" -DestinationPath dist -Force
          if (Test-Path "dist/wcpos-dist") {
            Get-ChildItem -Path "dist/wcpos-dist" | Move-Item -Destination "dist" -Force
            Remove-Item -Path "dist/wcpos-dist" -Recurse -Force
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
      
      - name: 📦 Install dépendances (sans postinstall)
        run: npm install --ignore-scripts
        shell: pwsh

      - name: 🔨 Rebuild better-sqlite3
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          npx @electron/rebuild -v $electronVersion -f -o better-sqlite3
        shell: pwsh

      - name: 🚀 Build Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-forge make --platform=win32 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-log.txt | Select-Object -Last 300
            exit 1
          }
          Get-ChildItem -Path "out/make" -Recurse -Filter "*.zip" | Remove-Item -Force
        shell: pwsh

      - name: 📋 Upload build log en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: 📦 Créer zip final
        if: success()
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zipName = "POSTir-v$version.zip"
          $appDir = Get-ChildItem -Path "out" -Recurse -Directory | Where-Object { (Test-Path "$($_.FullName)\resources\dist") } | Select-Object -First 1
          if ($appDir) {
            Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath "out\$zipName" -Force
            Write-Host "✅ $zipName créé"
          } else {
            Write-Host "❌ Dossier applicatif non trouvé"
            exit 1
          }

      - name: 📦 Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PosTir
          path: out/*.zip
          if-no-files-found: error
