name: Publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à compiler'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du fork
        uses: actions/checkout@v4

      - name: 📦 Télécharge le bundle depuis la release du fork
        run: |
          # Télécharge le zip depuis la release bundle-v1.8.9
          Invoke-WebRequest `
            -Uri "https://github.com/ilyes-itune/wcpos-custom/releases/download/bundle-v1.8.9/wcpos-dist.zip" `
            -OutFile "wcpos-dist.zip" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }

          # Extrait dans dist/
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "wcpos-dist.zip" -DestinationPath dist -Force

          Write-Host "Contenu du dist :"
          Get-ChildItem dist | Select-Object Name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: 🏗 Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install et rebuild modules natifs
        run: |
          npm install
          npm run rebuild:all
        shell: pwsh

      - name: 🚀 Build Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run make -- --platform=win32
        shell: pwsh

      - name: 📦 Upload l'exécutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: wcpos-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
          if-no-files-found: warn
