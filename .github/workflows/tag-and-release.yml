name: Publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à compiler'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du fork
        uses: actions/checkout@v4

      - name: 📦 Télécharge le bundle depuis la release du fork
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/ilyes-itune/wcpos-custom/releases/download/bundle-v1.8.9/wcpos-dist.zip" `
            -OutFile "wcpos-dist.zip" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "wcpos-dist.zip" -DestinationPath dist -Force
          # Si un sous-dossier wcpos-dist/ est créé, on remonte son contenu
          if (Test-Path "dist/wcpos-dist") {
            Get-ChildItem -Path "dist/wcpos-dist" | Move-Item -Destination "dist" -Force
            Remove-Item -Path "dist/wcpos-dist" -Recurse -Force
          }
          Write-Host "Contenu du dist :"
          Get-ChildItem dist -Recurse -Depth 2 | Select-Object FullName
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
      
      - name: 📦 Install dépendances (sans postinstall)
        run: npm install --ignore-scripts
        shell: pwsh

      - name: 🔨 Rebuild better-sqlite3
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "Electron version: $electronVersion"
          npx @electron/rebuild -v $electronVersion -f -o better-sqlite3
        shell: pwsh

      - name: 🚀 Build Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-forge make --platform=win32 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== DERNIÈRES 300 LIGNES DU LOG ==="
            Get-Content build-log.txt | Select-Object -Last 300
            exit 1
          }
        shell: pwsh

      - name: 📋 Upload build log en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: 📦 Aplatir l'artefact
        if: success()
        shell: pwsh
        run: |
          Write-Host "=== Contenu de out/make/ (debug) ==="
          Get-ChildItem -Path "out/make" -Recurse -Depth 4 | Select-Object FullName
          
          # Chercher le dossier POSTir-*
          $exeDir = Get-ChildItem -Path "out/make" -Recurse -Directory | Where-Object { $_.Name -like "POSTir-*" } | Select-Object -First 1
          
          if ($exeDir) {
            Write-Host "Dossier POSTir trouvé : $($exeDir.FullName)"
            $zipName = "$($exeDir.Name).zip"
            Compress-Archive -Path "$($exeDir.FullName)\*" -DestinationPath "out\$zipName" -Force
            Write-Host "✅ Zip créé : out\$zipName"
          } else {
            Write-Host "⚠️ Dossier POSTir non trouvé, on zippe tout out/make"
            Compress-Archive -Path "out\make\*" -DestinationPath "out\PosTir-make.zip" -Force
          }

      - name: 📦 Upload l'exécutable Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PosTir
          path: |
            out/*.zip
          if-no-files-found: warn
